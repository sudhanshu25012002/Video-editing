<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',sans-serif;width:1080px;height:1350px;overflow:hidden;position:relative;
  background:#F3ECDF;background-image:radial-gradient(rgba(28,23,38,.10) 1.6px,transparent 1.6px);background-size:28px 28px;color:var(--ink)}
.a{position:absolute}
.ph{background-size:cover;background-position:center}
.pan{position:absolute;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(40,30,20,.35),0 0 0 1px rgba(0,0,0,.04)}
/* social bar */
.bar{left:40px;top:22px;width:1000px;height:58px;background:#fff;border-radius:30px;box-shadow:0 6px 18px -8px rgba(0,0,0,.25);display:flex;align-items:center;padding:0 26px}
.bar .ic{display:flex;gap:18px;align-items:center}
.bar .h{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;color:#222;pointer-events:none}
.bar .sv{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#222}
/* common UI bits */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px 5px 6px;border-radius:20px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.btn{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:9px 16px;border-radius:20px}
.btn.l{background:var(--acc);color:var(--onacc)}
.mut{color:var(--mut)}
.acc{color:var(--acc2)}
.card{position:absolute;background-color:var(--soft);border-radius:16px}
.glass{position:absolute;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
.stars{color:#E8A23A;font-size:11px;letter-spacing:1px}
</style></head><body>
<div id="root"></div>
<script>
const B = BRANDS_JSON;
const K = new URLSearchParams(location.search).get('b');
const b = B[K];
const R = document.documentElement.style;
for (const [k,v] of Object.entries(b.c)) R.setProperty('--'+k, v);
const I = n => `url(img/${n})`;
const svg = (p,s=22,c='#222',f='none',w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  heart:'<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/>',
  chat:'<path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.3A8.5 8.5 0 1 1 20.5 11.5z"/>',
  send:'<path d="M22 3 11 13"/><path d="M22 3l-7 18-4-8-8-4z"/>',
  mark:'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
  bag:'<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  truck:'<path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  leaf:'<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19 13 11"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  gift:'<path d="M3 9h18v4H3zM5 13h14v8H5zM12 9v12"/><path d="M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6 .5 6-1.5S14 5 12 9z"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>'
};
const ic = (n,s,c,w) => svg(ICON[n],s,c,'none',w);
const H = [];
const add = s => H.push(s);

/* ---------- social bar ---------- */
add(`<div class="a bar"><div class="ic">${svg(ICON.heart,26,'#E5243B','#E5243B',1.5)}${ic('chat',25,'#222',1.8)}${ic('send',24,'#222',1.8)}</div>
<div class="h">@helioslabs.store</div><div class="sv">SAVE for LATER ${svg(ICON.mark,22,'#111','#111',1.5)}</div></div>`);

/* ---------- LEFT PANEL ---------- */
const L = [];
const l = s => L.push(s);
// hero
l(`<div class="a" style="left:0;top:0;width:592px;height:404px;background:${b.heroBg}"></div>`);
l(`<div class="a ph" style="left:${b.heroX||200}px;top:0;width:${592-(b.heroX||200)}px;height:404px;background-image:${I(b.img.hero)};background-position:${b.heroPos||'center'};-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%)"></div>`);
// nav pill
l(`<div class="a" style="left:86px;top:16px;width:420px;height:36px;background:rgba(255,255,255,.88);border-radius:20px;display:flex;align-items:center;padding:0 6px 0 14px;gap:14px;font-size:9.5px;font-weight:500;box-shadow:0 4px 14px -8px rgba(0,0,0,.3)">
 <b style="font-size:12px;font-weight:800;letter-spacing:${b.navTrack||'-.01em'};color:var(--ink);display:flex;align-items:center;gap:5px">${ic(b.navIcon,13,'var(--acc2)',2.4)}${b.name}</b>
 <span style="background:var(--soft);padding:4px 9px;border-radius:12px;font-weight:600">Shop</span><span>${b.nav[0]}</span><span>${b.nav[1]}</span><span>About</span>
 <span class="btn" style="margin-left:auto;padding:6px 12px;font-size:9px">${b.navBtn}</span></div>`);
l(`<div class="a" style="left:34px;top:94px"><span class="chip"><i></i>${b.heroChip}</span></div>`);
l(`<div class="a" style="left:32px;top:122px;font-size:${b.h1s||54}px;line-height:1.02;font-weight:${b.h1w||500};letter-spacing:-.035em;color:${b.heroInk||'var(--ink)'};width:400px">${b.h1}</div>`);
l(`<div class="a mut" style="left:34px;top:248px;width:230px;font-size:11px;line-height:1.5;color:${b.heroMut||'var(--mut)'}">${b.heroSub}</div>`);
l(`<div class="a" style="left:34px;top:304px;display:flex;gap:8px"><span class="btn l">${b.heroCta}</span><span class="btn" style="background:rgba(255,255,255,.9);color:var(--ink)">${b.heroCta2}</span></div>`);
// floating cards
const f1 = b.float1, f2 = b.float2;
l(`<div class="glass" style="left:${f1.x}px;top:${f1.y}px;width:150px;padding:10px 12px">
  <div style="display:flex;align-items:center;gap:8px"><div class="ph" style="width:34px;height:34px;border-radius:9px;background-image:${I(f1.img)}"></div>
  <div><div style="font-size:9px;color:var(--mut);font-weight:600">${f1.k}</div><div style="font-size:12px;font-weight:700">${f1.v}</div></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><b style="font-size:15px">${f1.p}</b><span style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px">+</span></div></div>`);
l(`<div class="glass" style="left:${f2.x}px;top:${f2.y}px;width:162px;padding:10px 12px">
  <div style="display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:700">${ic(f2.icon,15,'var(--acc2)',2.2)}${f2.k}</div>
  <div style="display:flex;gap:10px;margin-top:7px">${f2.cols.map(c=>`<div><div style="font-size:16px;font-weight:700;letter-spacing:-.02em">${c[0]}</div><div style="font-size:8px;color:var(--mut)">${c[1]}</div></div>`).join('')}</div></div>`);

// section 2
const s2 = 428;
l(`<div class="a" style="left:0;width:592px;top:${s2}px;text-align:center"><span class="chip"><i></i>${b.s2chip}</span>
 <div style="font-size:31px;font-weight:500;letter-spacing:-.03em;line-height:1.12;margin-top:10px">${b.s2a}<br><span class="acc">${b.s2b}</span></div>
 <div class="mut" style="font-size:10.5px;margin:8px auto 0;width:360px;line-height:1.5">${b.s2sub}</div></div>`);
const gy = s2 + 150, cw = 172, gap = 12, cx0 = 26, ch = 170;
const stat = (x,y,s) => `<div class="card" style="left:${x}px;top:${y}px;width:${cw}px;height:${ch}px;padding:16px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font-size:36px;font-weight:500;letter-spacing:-.04em;color:var(--acc2)">${s[0]}</div><span style="opacity:.55">${ic(s[3],24,'var(--acc2)',1.6)}</span></div>
  <div style="position:absolute;left:16px;right:14px;bottom:16px"><div style="font-size:12.5px;font-weight:700;line-height:1.25">${s[1]}</div><div class="mut" style="font-size:9.5px;margin-top:5px;line-height:1.45">${s[2]}</div></div></div>`;
l(stat(cx0, gy, b.stats[0])); l(stat(cx0, gy+ch+gap, b.stats[1]));
const mw = 592 - 2*cx0 - 2*cw - 2*gap;
l(`<div class="card ph" style="left:${cx0+cw+gap}px;top:${gy}px;width:${mw}px;height:${2*ch+gap}px;background-image:${I(b.img.tall)};background-position:${b.tallPos||'center'}"></div>
 <div class="a" style="left:${cx0+cw+gap}px;top:${gy}px;width:${mw}px;height:${2*ch+gap}px;border-radius:16px;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 34%,transparent 62%,rgba(0,0,0,.6))"></div>
 <div class="a" style="left:${cx0+cw+gap+16}px;top:${gy+14}px;color:#fff;font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1.1">${b.tallT}</div>
 <div class="a" style="left:${cx0+cw+gap+16}px;top:${gy+2*ch+gap-50}px;width:${mw-32}px;color:#fff;font-size:9.5px;line-height:1.45;opacity:.95">${b.tallS}</div>`);
const x3 = cx0+cw+gap+mw+gap;
l(stat(x3, gy, b.stats[2])); l(stat(x3, gy+ch+gap, b.stats[3]));

// section 3
const s3 = gy + 2*ch + gap + 32;
l(`<div class="a" style="left:30px;top:${s3+40}px;width:150px">
  <div class="mut" style="font-size:10px;line-height:1.5">${b.s3side}</div>
  <div style="margin-top:14px;font-size:10px;font-weight:600">${b.s3tabs.map((t,i)=>`<div style="padding:8px 10px;border-left:2px solid ${i?'transparent':'var(--acc2)'};background:${i?'transparent':'var(--soft)'};${i?'color:var(--mut)':''}">${t}</div>`).join('')}</div></div>`);
l(`<div class="a" style="left:200px;top:${s3}px;width:370px"><span class="chip"><i></i>${b.s3chip}</span>
  <div style="font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1.12;margin-top:9px">${b.s3a}<br>${b.s3b}</div></div>`);
l(`<div class="card ph" style="left:200px;top:${s3+88}px;width:366px;height:162px;background-image:${I(b.img.banner)};background-position:${b.bannerPos||'center'}"></div>`);
// mini product strip over banner
l(`<div class="glass" style="left:${b.miniX||330}px;top:${s3+100}px;width:220px;padding:10px">
  <div style="display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:5px 8px;font-size:8.5px;color:var(--mut)">${ic('search',10,'#888',2.2)}${b.miniSearch}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px">${b.mini.map(m=>`<div><div class="ph" style="height:46px;border-radius:8px;background-image:${I(m[0])}"></div><div style="font-size:8.5px;font-weight:600;margin-top:4px">${m[1]}</div><div style="font-size:8.5px;color:var(--acc2);font-weight:700">${m[2]}</div></div>`).join('')}</div></div>`);
l(`<div class="a" style="left:200px;top:${s3+260}px;width:366px;display:flex;justify-content:space-between;font-size:10.5px"><b>${b.s3cap}</b><span class="mut" style="width:170px;font-size:9px;line-height:1.45">${b.s3capS}</span></div>`);

add(`<div class="pan" style="left:40px;top:100px;width:592px;height:1290px"><div style="position:relative;width:100%;height:100%">${L.join('')}</div></div>`);

/* ---------- RIGHT COLUMN ---------- */
const RX = 652, RW = 388;
// pricing
const P = [];
P.push(`<div class="a" style="left:0;top:18px;width:${RW}px;text-align:center"><span class="chip"><i></i>${b.pChip}</span>
 <div style="font-size:21px;font-weight:500;letter-spacing:-.025em;line-height:1.15;margin-top:8px">${b.pA}<br><span class="acc">${b.pB}</span></div>
 <div class="mut" style="font-size:8.5px;margin-top:5px">${b.pSub}</div></div>`);
b.plans.forEach((p,i)=>{ const x = 14 + i*122, hl = i===1;
 P.push(`<div class="a" style="left:${x}px;top:132px;width:114px;height:200px;border-radius:13px;background:${hl?'var(--ink)':'var(--soft)'};color:${hl?'#fff':'var(--ink)'};padding:8px">
  <div class="ph" style="height:58px;border-radius:9px;background-image:${I(p.img)}"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><b style="font-size:11px">${p.n}</b><b style="font-size:11px;color:${hl?'var(--acc)':'var(--acc2)'}">${p.p}</b></div>
  <div style="font-size:7.5px;opacity:.6;margin-top:1px">${p.u}</div>
  <div style="margin-top:7px;font-size:7.8px;line-height:1.75">${p.f.map(f=>`<div style="display:flex;gap:4px;align-items:center">${ic('check',8,hl?'var(--acc)':'var(--acc2)',3)}${f}</div>`).join('')}</div>
  <div style="position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:8.5px;font-weight:600;padding:6px 0;border-radius:12px;background:${hl?'var(--acc)':'var(--ink)'};color:${hl?'var(--onacc)':'#fff'}">${p.b}</div></div>`); });
add(`<div class="pan" style="left:${RX}px;top:100px;width:${RW}px;height:346px"><div style="position:relative;height:100%">${P.join('')}</div></div>`);

// dark stats band
add(`<div class="pan" style="left:${RX}px;top:458px;width:${RW}px;height:236px;background:var(--dark)">
 <div class="a ph" style="left:0;top:70px;width:240px;height:166px;background-image:${I(b.img.dark)};background-position:${b.darkPos||'center'};-webkit-mask-image:linear-gradient(0deg,#000 55%,transparent),linear-gradient(270deg,transparent,#000 30%);-webkit-mask-composite:source-in;mask-composite:intersect"></div>
 <div class="a" style="left:20px;top:20px;width:200px;color:#fff;font-size:15.5px;font-weight:500;letter-spacing:-.02em;line-height:1.2">${b.dA}<br><span style="color:var(--acc)">${b.dB}</span></div>
 <div class="a" style="left:236px;top:22px;width:140px;color:#fff">${b.dStats.map(s=>`<div style="margin-bottom:12px"><div style="font-size:23px;font-weight:600;letter-spacing:-.03em">${s[0]}</div><div style="font-size:8px;opacity:.65;line-height:1.35">${s[1]}</div></div>`).join('')}</div></div>`);

// testimonials
const T = [];
T.push(`<div class="a" style="left:0;top:20px;width:${RW}px;text-align:center"><span class="chip"><i></i>Testimonials</span>
 <div style="font-size:20px;font-weight:500;letter-spacing:-.025em;line-height:1.15;margin-top:8px">${b.tA}<br><span class="acc">${b.tB}</span></div>
 <div class="mut" style="font-size:8.5px;margin-top:5px">${b.tSub}</div></div>`);
b.tests.forEach((t,i)=>{ const x = 12 + i*124;
 T.push(`<div class="a" style="left:${x}px;top:128px;width:116px;height:176px;border-radius:13px;background:var(--soft);padding:10px">
  ${t[3]?`<div style="margin:2px 0 6px">${ic(t[3],20,'var(--acc2)',1.8)}</div><div style="font-size:9.5px;font-weight:700;margin-bottom:4px">${t[1]}</div>`:`<div style="font-size:26px;line-height:.8;color:var(--acc2);font-family:Georgia,serif">“</div>`}
  <div style="font-size:8.3px;line-height:1.5;margin-top:2px">${t[0]}</div>
  ${t[3]?'':`<div class="stars" style="position:absolute;left:10px;bottom:44px">★★★★★</div>
  <div style="position:absolute;left:10px;right:8px;bottom:10px;display:flex;align-items:center;gap:6px">
   <div style="width:24px;height:24px;border-radius:50%;background:${['var(--acc)','var(--ink)','var(--acc2)'][i]};color:${i==0?'var(--onacc)':'#fff'};display:grid;place-items:center;font-size:9px;font-weight:700">${t[1].split(' ').map(w=>w[0]).join('')}</div>
   <div><div style="font-size:8.5px;font-weight:700">${t[1]}</div><div style="font-size:7.5px;color:var(--mut)">${t[2]}</div></div></div>`}</div>`); });
T.push(`<div class="a" style="left:0;top:314px;width:${RW}px;display:flex;justify-content:center;gap:5px">${[0,1,2,3].map(i=>`<span style="width:${i?6:16}px;height:6px;border-radius:3px;background:${i?'#ddd':'var(--ink)'}"></span>`).join('')}</div>`);
add(`<div class="pan" style="left:${RX}px;top:706px;width:${RW}px;height:336px"><div style="position:relative;height:100%">${T.join('')}</div></div>`);

// footer
add(`<div class="pan" style="left:${RX}px;top:1054px;width:${RW}px;height:340px;background:${b.footBg}">
 <div class="a" style="left:18px;top:18px;width:130px"><div style="font-size:11px;font-weight:800;display:flex;gap:5px;align-items:center;letter-spacing:${b.navTrack||'-.01em'}">${ic(b.navIcon,12,'var(--acc2)',2.4)}${b.name}</div>
   <div class="mut" style="font-size:7.5px;line-height:1.5;margin-top:5px">${b.footTag}</div>
   <div style="margin-top:7px;display:flex;gap:4px"><span style="flex:1;background:#fff;border-radius:10px;font-size:7px;padding:5px 7px;color:#999">Your email</span><span class="btn l" style="font-size:7px;padding:5px 8px">Join</span></div></div>
 ${[['Shop',b.fcol],['Company',['About','Stores','Careers']],['Help',['Delivery','Returns','Contact']]].map((c,i)=>`<div class="a" style="left:${170+i*72}px;top:20px;font-size:7.5px;line-height:1.75"><b style="font-size:8.5px">${c[0]}</b>${c[1].map(x=>`<div class="mut">${x}</div>`).join('')}</div>`).join('')}
 <div class="a ph" style="left:0;top:${b.footImgTop||150}px;width:${RW}px;height:${340-(b.footImgTop||150)}px;background-image:${I(b.img.foot)};background-position:${b.footPos||'center'};-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%)"></div>
 <div class="a" style="left:0;width:${RW}px;top:${b.wmTop||96}px;text-align:center;font-size:${b.wmSize||74}px;font-weight:${b.wmW||600};letter-spacing:${b.wmTrack||'-.05em'};color:var(--wm);line-height:1">${b.wordmark}<sup style="font-size:18px;vertical-align:top;position:relative;top:4px;margin-left:2px">®</sup></div></div>`);

// avatar (storefront logo) + credit
add(`<div class="a" style="left:22px;top:1262px;width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden"><img src="data:image/png;base64,STOREB64" style="width:100%;height:100%;object-fit:cover"></div>`);

document.getElementById('root').innerHTML = H.join('');
</script></body></html>
