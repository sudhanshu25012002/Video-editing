<!doctype html><meta charset="utf-8"><script>
// Night reel score + sound design (all times in voiceover seconds)

  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(DUR * sr), sr);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ctx.destination);

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 1073741823.5 - 1;

  const env = (g, t, a, pk, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };

  function pluck(t, m, v = 0.12, dest = mus) { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = 'triangle'; o.frequency.value = hz(m); lp.type = 'lowpass';

    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = cut;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(0.8, len / 3)); g.gain.setValueAtTime(v, t + len - 0.4); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.3);
    o.connect(lp).connect(g).connect(mus); o.start(t); o.stop(t + len + 0.4); })); }
  function bass(t, m, len, v = 0.16) { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = hz(m); lp.type = 'lowpass'; lp.frequency.value = 300; env(g, t, 0.01, v, len); o.connect(lp).connect(g).connect(mus); o.start(t); o.stop(t + len + 0.05); }
  function kick(t, v = 0.7, dest = master) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); env(g, t, 0.003, v, 0.3); o.connect(g).connect(dest); o.start(t); o.stop(t + 0.4); }
  function nz(t, len, f, type, v, dest = master, q = 1) { const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q; env(g, t, 0.003, v, len); s.connect(fl).connect(g).connect(dest); s.start(t); s.stop(t + len + 0.05); }
  function sweep(t, f0, f1, len, v, dest = fx, q = 1.2) { const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; s.loop = true; fl.type = 'bandpass'; fl.Q.value = q;

  const hat = (t, v = 0.045) => nz(t, 0.05, 8000, 'highpass', v);
  const { DROP, REBUILD, STOP, START, RESOLVE } = P;



  // energetic hustle beat, 120 BPM (Am - F - C - G); drops out on "grow nahi", rebuilds on "smart systems",
  // cuts dead on "STOP", comes back big on "START"
  const B = 0.5, prog = [[45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50]];

      if (b === 1 || b === 3) clap(tb);

    }

  }
  // the drop: a lonely low pad under "Sach ye hai…"

  sweep(REBUILD - 1.0, 300, 5000, 1.0, 0.1, master);

  kick(START, 0.9); nz(START, 1.0, 5000, 'highpass', 0.07);
  kick(RESOLVE, 0.8); pad(RESOLVE, [48, 52, 55, 60, 64], DUR - RESOLVE - 0.3, 0.045, 2200); [72, 76, 79, 84].forEach((m, k) => pluck(RESOLVE + k * 0.12, m, 0.09));

  SFX.forEach(([type, t]) => {
    if (type === 'shutter') { for (let k = 0; k < 14; k++) nz(t + k * 0.05, 0.04, 900 + (k % 3) * 300, 'bandpass', 0.12, fx, 3); nz(t + 0.72, 0.12, 400, 'lowpass', 0.25, fx); }
    if (type === 'scribble') { for (let k = 0; k < 6; k++) nz(t + k * 0.06, 0.05, 2600 + (k % 2) * 900, 'bandpass', 0.05, fx, 2); }
    if (type === 'thunk') { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.25); env(g, t, 0.004, 0.5, 0.35); o.connect(g).connect(fx); o.start(t); o.stop(t + 0.5); nz(t, 0.06, 700, 'bandpass', 0.15, fx); }
    if (type === 'creak') { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.linearRampToValueAtTime(140, t + 0.35); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 6; env(g, t, 0.05, 0.04, 0.3); o.connect(bp).connect(g).connect(fx); o.start(t); o.stop(t + 0.45); }
    if (type === 'boom') { kick(t, 0.6, fx); nz(t, 0.9, 300, 'lowpass', 0.12, fx); }
    if (type === 'snap') nz(t, 0.025, 2200, 'bandpass', 0.18, fx, 3);
    if (type === 'pop') { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1300, t + 0.05); env(g, t, 0.004, 0.16, 0.08); o.connect(g).connect(fx); o.start(t); o.stop(t + 0.12); }
    if (type === 'rise') { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(hz(60), t); o.frequency.exponentialRampToValueAtTime(hz(79), t + 0.9); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0); o.connect(g).connect(fx); o.start(t); o.stop(t + 1.1); }
    if (type === 'like') { tone(t, 900, 0.12, 0.14, 'sine', fx); tone(t + 0.05, 1350, 0.15, 0.1, 'sine', fx); }
    if (type === 'type') nz(t, 0.02, 3200, 'bandpass', 0.1, fx, 2);
    if (type === 'send') sweep(t, 600, 3200, 0.35, 0.12);
    if (type === 'buzz') { [0, 0.28].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = 62; env(g, t + d, 0.01, 0.07, 0.16); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200; o.connect(lp).connect(g).connect(fx); o.start(t + d); o.stop(t + d + 0.2); }); }
    if (type === 'tick') { nz(t, 0.02, 2500, 'bandpass', 0.22, fx, 4); nz(t + 0.25, 0.02, 1900, 'bandpass', 0.16, fx, 4); }
    if (type === 'tap') nz(t, 0.03, 1800, 'bandpass', 0.25, fx, 2);
    if (type === 'dimding') { tone(t, hz(76), 0.5, 0.07, 'sine', fx); tone(t + 0.1, hz(72), 0.6, 0.06, 'sine', fx); }
    if (type === 'whip') sweep(t, 500, 3000, 0.4, 0.09);
    if (type === 'birds') { for (let k = 0; k < 5; k++) { const tt = t + k * 0.28 + (k % 2) * 0.07; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(2600 + k * 120, tt); o.frequency.exponentialRampToValueAtTime(3900, tt + 0.07); o.frequency.exponentialRampToValueAtTime(3100, tt + 0.12); env(g, tt, 0.005, 0.05, 0.12); o.connect(g).connect(fx); o.start(tt); o.stop(tt + 0.2); } }
    if (type === 'sunrise') [72, 76, 79, 84].forEach((m, k) => bell(t + k * 0.12, m, 0.06, fx));
    if (type === 'notify') { tone(t, hz(88), 0.4, 0.14, 'sine', fx); tone(t + 0.09, hz(95), 0.5, 0.12, 'sine', fx); }
    if (type === 'sad') { tone(t, hz(64), 0.5, 0.12, 'triangle', fx); tone(t + 0.32, hz(60), 0.9, 0.12, 'triangle', fx); tone(t + 0.32, hz(55), 0.9, 0.06, 'triangle', fx); }
    if (type === 'order') [84, 88, 91, 96].forEach((m, k) => tone(t + k * 0.07, hz(m), 0.6, 0.1, 'sine', fx));
    if (type === 'chime') [79, 84].forEach((m, k) => bell(t + k * 0.14, m, 0.07, fx));

    if (type === 'fill') { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(hz(60), t); o.frequency.exponentialRampToValueAtTime(hz(72), t + 1.2);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 1.0); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4); o.connect(g).connect(fx); o.start(t); o.stop(t + 1.5); }
  });

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }

};
