<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#F3ECDF;--pur:#5A17E6;--pur2:#7B3CFF;--ink:#1C1726;--mut:#7D7466;--card:#FFFDF8;--line:#E4D9C6;--lime:#C8F23C;--gold:#F2B33D}
*{box-sizing:border-box}html,body{margin:0;background:#bbb}
body{font-family:'Inter',sans-serif;color:var(--ink)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:20px;background:var(--bg);
  background-image:radial-gradient(rgba(28,23,38,.10) 1.6px,transparent 1.6px);background-size:28px 28px}
.a{position:absolute}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.hd{position:absolute;left:64px;right:64px;top:56px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:24px;letter-spacing:-.01em}
.hd img{width:56px;height:56px;border-radius:15px}
.hd .pg{margin-left:auto;font-size:20px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.7);padding:8px 16px;border-radius:30px;border:1px solid var(--line)}
.ft{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;font-size:21px;font-weight:600;color:var(--mut)}
.ft .sw{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:14px 24px;border-radius:40px;font-size:20px}
.k{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:10px 18px 10px 12px;border-radius:40px;font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pur)}
.k i{width:12px;height:12px;border-radius:50%;background:var(--pur);display:block}
h1,h2{margin:0;font-weight:800;letter-spacing:-.045em;line-height:.98}
.pur{color:var(--pur)}
.hl{background:linear-gradient(180deg,transparent 58%,rgba(90,23,230,.22) 58%)}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:0 24px 50px -30px rgba(40,25,10,.35)}
.phone{position:absolute;width:300px;height:620px;border-radius:46px;background:#141118;padding:11px;box-shadow:0 40px 70px -30px rgba(30,10,60,.55)}
.phone div{width:100%;height:100%;border-radius:36px;background-size:cover;background-position:top center}
.pill{position:absolute;background:rgba(255,255,255,.92);border-radius:22px;padding:16px 20px;box-shadow:0 20px 40px -18px rgba(30,10,60,.45);display:flex;gap:14px;align-items:center;font-size:19px}
.pill b{display:block;font-size:20px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.brw{position:absolute;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 34px 60px -30px rgba(30,10,60,.5);border:1px solid var(--line)}
.brw .bar{height:44px;background:#F6F2EA;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.brw .bar i{width:12px;height:12px;border-radius:50%;display:block}
.brw .bar span{margin-left:14px;background:#fff;border-radius:20px;padding:5px 16px;font-size:15px;color:#666;border:1px solid var(--line)}
.brw .sc{background-size:cover;background-position:top center}
</style></head><body>
<script>
const LG = 'data:image/png;base64,STOREB64';
const SH = n => `url(shots/${n}.png)`;
// iPhone 17/18 Pro screen (402x874pt) — screen UI only, no hardware frame
const IOS = { st_m_home: ['st_i_home', '#f8d486', 0, 'store.helioslabs.in'], st_m_best: ['st_i_best', '#fdf8ee', 0, 'store.helioslabs.in'], sh_m_home: ['sh_i_home', '#09090b', 1, 'shop.helioslabs.in'] };
const phone = (x, y, key, r = 0, s = 1) => {
  const [img, bg, dark, url] = IOS[key]; const W = 300, k = W / 402, H = Math.round(874 * k), p = v => (v * k).toFixed(2) + 'px';
  const fg = dark ? '#fff' : '#000';
  const sig = `<svg width="${p(19)}" height="${p(12)}" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1" fill="${fg}"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1" fill="${fg}"/><rect x="10" y="3" width="3.2" height="9" rx="1" fill="${fg}"/><rect x="15" y="0" width="3.2" height="12" rx="1" fill="${fg}"/></svg>`;
  const wifi = `<svg width="${p(17)}" height="${p(12)}" viewBox="0 0 17 12"><path d="M8.5 2.3c2.6 0 4.9 1 6.6 2.6l1.2-1.2C14.3 1.7 11.5.5 8.5.5S2.7 1.7.7 3.7l1.2 1.2C3.6 3.3 5.9 2.3 8.5 2.3z" fill="${fg}"/><path d="M8.5 5.9c1.6 0 3.1.6 4.1 1.6l1.2-1.2C12.4 4.9 10.5 4.1 8.5 4.1S4.6 4.9 3.2 6.3l1.2 1.2c1.1-1 2.5-1.6 4.1-1.6z" fill="${fg}"/><path d="M8.5 9.4c.6 0 1.2.2 1.6.6l-1.6 1.7-1.6-1.7c.4-.4 1-.6 1.6-.6z" fill="${fg}"/></svg>`;
  const bat = `<svg width="${p(27)}" height="${p(13)}" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="${fg}" stroke-opacity=".38"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="${fg}"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="${fg}" fill-opacity=".45"/></svg>`;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;transform:rotate(${r}deg) scale(${s});border-radius:${p(62)};overflow:hidden;background:${bg};
    box-shadow:0 40px 70px -28px rgba(30,10,60,.55),0 0 0 1px rgba(0,0,0,.08)">
   <div style="position:absolute;left:0;right:0;top:${p(62)};bottom:0;background:url(shots/${img}.png) top center/100% auto no-repeat"></div>
   <div style="position:absolute;left:0;right:0;top:0;height:${p(62)};background:${bg}"></div>
   <div style="position:absolute;left:${p(51)};top:${p(19)};font:600 ${p(17)}/${p(22)} 'Inter',sans-serif;letter-spacing:-.01em;color:${fg}">9:41</div>
   <div style="position:absolute;left:50%;top:${p(11)};width:${p(125)};height:${p(37)};margin-left:${p(-62.5)};border-radius:${p(20)};background:#000"></div>
   <div style="position:absolute;right:${p(30)};top:${p(23)};display:flex;align-items:center;gap:${p(6)}">${sig}${wifi}${bat}</div>
   <div style="position:absolute;left:${p(14)};right:${p(14)};bottom:${p(30)};height:${p(50)};display:flex;align-items:center;gap:${p(8)}">
     <div style="width:${p(50)};height:${p(50)};border-radius:50%;background:rgba(250,250,252,.82);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(0,0,0,.18);display:grid;place-items:center;font:500 ${p(26)} 'Inter';color:#111;flex:none">‹</div>
     <div style="flex:1;height:${p(50)};border-radius:${p(25)};background:rgba(250,250,252,.82);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:${p(6)};font:500 ${p(15)} 'Inter';color:#111">
       <svg width="${p(10)}" height="${p(13)}" viewBox="0 0 10 13"><rect x="0" y="5.5" width="10" height="7.5" rx="1.6" fill="#111"/><path d="M2.3 5.6V3.9a2.7 2.7 0 0 1 5.4 0v1.7" fill="none" stroke="#111" stroke-width="1.4"/></svg>${url}</div>
     <div style="width:${p(50)};height:${p(50)};border-radius:50%;background:rgba(250,250,252,.82);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(0,0,0,.18);display:grid;place-items:center;font:700 ${p(18)} 'Inter';color:#111;flex:none;letter-spacing:.05em">···</div>
   </div>
   <div style="position:absolute;left:50%;bottom:${p(8)};width:${p(139)};height:${p(5)};margin-left:${p(-69.5)};border-radius:3px;background:${dark ? '#fff' : '#000'}"></div>
  </div>`;
};
const P = `
<div class="glow" style="left:520px;top:330px;width:620px;height:620px;background:#7B3CFF;opacity:.42"></div>
<div class="glow" style="left:-160px;top:-120px;width:420px;height:420px;background:#F2B33D;opacity:.3"></div>
<div class="hd"><img src="${LG}">HeliosLabs Storefront<span class="pg" style="color:var(--pur)">@helioslabs.store</span></div>

<h1 class="a" style="left:60px;top:160px;width:980px;font-size:100px">Sell online with<br>your <span class="pur">own store.</span></h1>
<div class="a" style="left:64px;top:388px;width:520px;font-size:29px;line-height:1.4;color:#4a4252">Turn your Instagram shop into a real website. <b style="color:var(--ink)">We design, build, host &amp; maintain it</b> — you just sell.</div>

<!-- flow -->
<div class="a" style="left:64px;top:548px;width:480px;display:flex;flex-direction:column;gap:14px">
${[['📸','Your Instagram','Followers find your brand','#FDECF3'],['🛍️','Your own store','Products, prices & sizes in one link','#F0E9FF'],['💳','Orders & payments','UPI, card or WhatsApp checkout','#E6F8EE']].map(([e,a,b,c],i)=>`
<div style="display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px 22px;${i==1?'box-shadow:0 0 0 3px var(--pur);':''}">
 <span class="ico" style="width:62px;height:62px;border-radius:18px;font-size:32px;background:${c}">${e}</span>
 <div><div style="font-size:28px;font-weight:800;letter-spacing:-.03em">${a}</div><div style="font-size:20px;color:var(--mut);margin-top:2px">${b}</div></div></div>
${i<2?'<div style="margin-left:52px;height:0;font-size:26px;line-height:0;color:var(--pur);font-weight:900">↓</div>':''}`).join('')}
</div>

${phone(580,470,'st_m_home',-5,.9)}${phone(752,432,'sh_m_home',5,.9)}
<div class="pill" style="left:560px;top:1010px"><span class="ico" style="background:#E6F8EE">✅</span><div><b>New order received</b>Paid via UPI · ₹1,240</div></div>

<!-- included strip -->
<div class="a" style="left:64px;top:1116px;width:952px;display:flex;flex-wrap:nowrap;gap:8px">
${['🎨 Custom design','🌐 Own domain','💬 WhatsApp orders','🔎 Google-ready','🛠️ Hosting & upkeep'].map(t=>`<span style="background:#fff;border:1px solid var(--line);border-radius:30px;padding:9px 12px;font-size:17px;font-weight:700;white-space:nowrap">${t}</span>`).join('')}
</div>

<!-- price + cta bar -->
<div class="a" style="left:64px;top:1196px;width:952px;height:110px;border-radius:32px;background:linear-gradient(120deg,#6A22FF,#4A0FCC);display:flex;align-items:center;padding:0 16px 0 34px;color:#fff;box-shadow:0 30px 60px -28px rgba(74,15,204,.8)">
 <div><div style="font-size:18px;font-weight:600;opacity:.8">Plans starting at</div><div style="font-size:50px;font-weight:800;letter-spacing:-.04em;line-height:1">₹999<span style="font-size:24px;font-weight:600;opacity:.8"> /month</span></div></div>
 <div style="margin-left:auto;background:#fff;color:var(--ink);border-radius:26px;padding:20px 30px;font-size:30px;font-weight:800;letter-spacing:-.02em">DM us <span style="color:var(--pur)">“STORE”</span> 💬</div>
</div>`;
document.write(`<div class="slide" id="s1">${P}</div>`);
</script></body></html>
