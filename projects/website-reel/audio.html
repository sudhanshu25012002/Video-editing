<!doctype html><meta charset="utf-8"><script>
// Score for the website reel (100 BPM, beat = 0.6s)
//  A  0–4.8   light, happy pluck tune (business running on Instagram)
//  B  4.8–18  music cuts on the block; low tense drone + heartbeat; riser into 18.0
//  C  18–49   uplifting progression C–G–Am–F with pad, plucks, bass and drums; resolves on C
window.renderScore = async function (DUR, SFX, P = { BAN: 4.8, WEB: 18.0, END: 47.4 }) {
  const { BAN, WEB, END } = P;
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(DUR * sr), sr);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ctx.destination);
  const master = ctx.createGain(); master.gain.value = 0.85; master.connect(comp);
  // simple generated reverb
  const ir = ctx.createBuffer(2, sr * 2.4, sr);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 1073741823.5 - 1;
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * Math.pow(1 - i / d.length, 3); }
  const verb = ctx.createConvolver(); verb.buffer = ir; const verbG = ctx.createGain(); verbG.gain.value = 0.28; verb.connect(verbG).connect(master);
  const musicBus = ctx.createGain(); musicBus.connect(master); musicBus.connect(verb);
  const sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master); const sfxVerb = ctx.createGain(); sfxVerb.gain.value = 0.25; sfxBus.connect(sfxVerb).connect(verb);
  const noise = ctx.createBuffer(1, sr * 2, sr); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const B = 0.6;

  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function pluck(t, m, v = 0.16, dest = musicBus) { const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = hz(m); o2.frequency.value = hz(m + 12); lp.type = 'lowpass'; lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(900, t + 0.3);
    env(g, t, 0.005, v, 0.45); o.connect(lp); o2.connect(lp); lp.connect(g).connect(dest); o.start(t); o2.start(t); o.stop(t + 0.6); o2.stop(t + 0.6); }
  function pad(t, notes, len, v = 0.05, cut = 1600) { notes.forEach(m => [-6, 6].forEach(det => { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = cut;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.35); g.gain.setValueAtTime(v, t + len - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.2);
    o.connect(lp).connect(g).connect(musicBus); o.start(t); o.stop(t + len + 0.3); })); }
  function bass(t, m, len, v = 0.22) { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(m); lp.type = 'lowpass'; lp.frequency.value = 320; env(g, t, 0.01, v, len);
    o.connect(lp).connect(g).connect(musicBus); o.start(t); o.stop(t + len + 0.05); }
  function kick(t, v = 0.85) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.003, v, 0.32); o.connect(g).connect(master); o.start(t); o.stop(t + 0.4); }
  function nz(t, len, f, type, v, dest = master, q = 1) { const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q; env(g, t, 0.003, v, len); s.connect(fl).connect(g).connect(dest); s.start(t); s.stop(t + len + 0.05); }
  const clap = t => { nz(t, 0.16, 1400, 'bandpass', 0.28, master, 0.8); nz(t + 0.012, 0.12, 1800, 'bandpass', 0.18, master, 0.8); };
  const hat = (t, v = 0.06) => nz(t, 0.05, 8000, 'highpass', v);

  // ---------- A: 0–4.8 (C, Am) ----------
  [[0, [60, 64, 67, 72]], [2.4, [57, 60, 64, 69]], [4.8, [60, 64, 67, 72]]].filter(([t0]) => t0 < BAN).forEach(([t0, ch]) => {
    pad(t0, ch.slice(0, 3).map(m => m - 12), 2.4, 0.03, 1200);
    bass(t0, ch[0] - 24, 1.1, 0.16); bass(t0 + 1.2, ch[0] - 24, 1.0, 0.14);
    for (let i = 0; i < 8; i++) if (t0 + i * 0.3 < BAN) pluck(t0 + i * 0.3, ch[[0, 1, 2, 3, 2, 1, 2, 3][i]] + 12, 0.12);
    [0, 1.2].forEach(d => { if (t0 + d < BAN) kick(t0 + d, 0.6); }); for (let i = 0; i < 4; i++) if (t0 + i * B + 0.3 < BAN) hat(t0 + i * B + 0.3, 0.04);
  });
  // ---------- B: 4.8–18 tension ----------
  function drone(t0, t1, notes, cut0, cut1) { notes.forEach(m => [-8, 8].forEach(det => { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut0, t0); lp.frequency.linearRampToValueAtTime(cut1, t1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.05, t0 + 1.2); g.gain.setValueAtTime(0.05, t1 - 0.8); g.gain.linearRampToValueAtTime(0.0001, t1);
    o.connect(lp).connect(g).connect(musicBus); o.start(t0); o.stop(t1 + 0.1); })); }
  const MID = BAN + (WEB - BAN) * 0.62;
  drone(BAN + 0.5, MID + 0.6, [33, 40, 45], 220, 520);      // A minor-ish, dark
  drone(MID - 0.2, WEB, [29, 36, 44], 300, 900);      // F with an unsettled G# above
  for (let t = BAN + 1.2; t < WEB - 1.0; t += 1.2) { kick(t, 0.32); kick(t + 0.22, 0.2); }   // heartbeat
  // riser into 18.0
  { const t0 = WEB - 1.6, t1 = WEB, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; s.loop = true; f.type = 'bandpass'; f.Q.value = 1.5; f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(6000, t1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.22, t1 - 0.03); g.gain.linearRampToValueAtTime(0, t1);
    s.connect(f).connect(g).connect(master); s.start(t0); s.stop(t1); }
  // ---------- C: 18–49 uplift ----------
  const PROG = [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48]];  // C G Am F
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  for (let bar = 0; WEB + bar * 2.4 < END - 0.01; bar++) {
    const t0 = WEB + bar * 2.4, ch = PROG[bar % 4];
    pad(t0, ch.map(m => m + 12), 2.4, 0.035, 1800);
    for (let i = 0; i < 8; i++) { const notes = [...ch.map(m => m + 24), ch[0] + 36]; pluck(t0 + i * 0.3, notes[ARP[i]], 0.1); }
    for (let i = 0; i < 8; i++) bass(t0 + i * 0.3, ch[0] - 12, 0.26, 0.15);
    for (let b = 0; b < 4; b++) { const tb = t0 + b * B; kick(tb, 0.75); hat(tb + 0.3, 0.05); if (t0 >= WEB + 2.4 && (b === 1 || b === 3)) clap(tb); if (t0 >= END - 7.2) hat(tb + 0.15, 0.03); }
  }
  // impact at 18.0 and final chord
  kick(WEB, 1.0); nz(WEB, 0.8, 600, 'lowpass', 0.35);
  pad(END, [48, 52, 55, 60, 64], DUR - END - 0.1, 0.05, 2000); bass(END, 36, 1.5, 0.2); pluck(END, 72, 0.14); pluck(END, 76, 0.1); kick(END, 0.8);

  // ---------- sound effects (only where the story needs them) ----------
  const bell = (t, ms, v) => ms.forEach((m, k) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = hz(m); env(g, t + k * 0.07, 0.004, v, 0.7); o.connect(g).connect(sfxBus); o.start(t + k * 0.07); o.stop(t + k * 0.07 + 0.8); });
  const whoosh = (t, f0, f1, len, v) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + len * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f).connect(g).connect(sfxBus); s.start(t); s.stop(t + len + 0.05); };
  const click = (t, f, v) => nz(t, 0.025, f, 'bandpass', v, sfxBus, 2);
  SFX.forEach(([type, t]) => {
    if (type === 'notify') bell(t, [88, 95], 0.16);
    if (type === 'lock') { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.35); env(g, t, 0.004, 0.9, 0.5); o.connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.6);
      click(t, 900, 0.5); click(t + 0.09, 1400, 0.4); }
    if (type === 'fall') whoosh(t, 2400, 250, 1.4, 0.16);
    if (type === 'order') bell(t, [84, 88, 91, 96], 0.12);
    if (type === 'type') click(t, 3200, 0.12);
    if (type === 'whip') whoosh(t, 500, 3000, 0.4, 0.1);
    if (type === 'key') { click(t, 2600, 0.35); click(t + 0.14, 1900, 0.4); }
    if (type === 'swing') whoosh(t, 300, 900, 0.7, 0.08);
  });
  // music stops dead at the block: duck the music bus to silence at 4.8
  musicBus.gain.setValueAtTime(1, BAN - 0.02); musicBus.gain.linearRampToValueAtTime(0.0001, BAN + 0.02); musicBus.gain.setValueAtTime(0.0001, BAN + 0.4); musicBus.gain.linearRampToValueAtTime(1, BAN + 0.6);

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};
</script>
