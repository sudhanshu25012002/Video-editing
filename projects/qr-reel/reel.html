<!doctype html>
<html>
<head>

<style>

  .brk { position: absolute; width: 90px; height: 90px; z-index: 401; }
  .touch { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 35px; background: rgba(28,23,38,0.30); box-shadow: 0 0 0 5px rgba(255,253,248,0.95), 0 8px 20px rgba(28,23,38,0.25); z-index: 420; }
  .ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 35px; box-shadow: 0 0 0 4px #5A17E6; z-index: 419; }
  #logoTL { position: absolute; left: 44px; top: 56px; width: 92px; height: 92px; z-index: 500; }
  #sub { position: absolute; left: 60px; right: 60px; top: 1530px; text-align: center; z-index: 500; }
  #sub span { display: inline-block; background: #FFFDF8; color: #1C1726; font-size: 36px; font-weight: 600; line-height: 1.32; padding: 14px 26px; border-radius: 16px; box-shadow: 0 0 0 2px #E2D8C6; }
</style>
</head>
<body>
<div id="stage">

<script>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
function springS(dt) { if (dt <= 0) return 0; if (dt > 1.6) return 1; const w = 2 * Math.PI * 2.2, z = 0.8, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt)); }
const sp = (t, t0) => springS(t - t0);
const expo = (t, t0, d) => { const p = clamp((t - t0) / d); return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); };
const inout = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const press = (t, tc) => 1 - 0.08 * Math.sin(Math.PI * clamp((t - tc) / 0.2));
const stage = document.getElementById('stage');
function E(parent, css, html, cls) { const e = document.createElement('div'); e.className = cls || 'a'; Object.assign(e.style, css || {}); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const texts = [];
function T(parent, x, y, size, html, o = {}) {
  const m = E(parent, { top: y + 'px', fontSize: size + 'px', zIndex: o.z || 10 }, '', 'mask');

}
function show(m, t, tIn, tOut = 1e9) { const a = sp(t, tIn), b = sp(t, tOut); m.inner.style.transform = `translateY(${(1 - a) * 110 - b * 110}%)`; m.style.visibility = (t < tIn || b > 0.995) ? 'hidden' : 'visible'; }
function pop(e, t, tIn, tOut = 1e9, extra = '') { const p = clamp(sp(t, tIn)) * (1 - clamp(sp(t, tOut))); e.style.transform = `${extra} scale(${p})`; e.style.visibility = p < 0.003 ? 'hidden' : 'visible'; }

function logoSVG(size) { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 1932 1932'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.innerHTML = `<rect class="bg" width="1932" height="1932" rx="300" fill="${PUR}" style="transform-box:fill-box;transform-origin:center"/><g class="br"><path d="${BRACE}" fill="${WHT}"/><path d="${BRACE}" fill="${WHT}" transform="rotate(180 967 948)"/></g>` + BARS.map(d => `<path class="bar" d="${d}" fill="${WHT}" style="transform-box:fill-box;transform-origin:center"/>`).join('');

  [...svg.querySelectorAll('.bar')].forEach((b, k) => b.style.transform = `scale(${clamp(sp(t, t0 + 0.1 + k * 0.08))})`); svg.style.visibility = t < t0 ? 'hidden' : 'visible'; }

function qrSVG(s, fg = INK, seed = 7) { qseed = seed; const n = 21, c = s / n; let h = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const inF = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7; let on;

const tkTn = tk.map(e => e.querySelector('.tn'));
const qmk = E(S2, { left: '470px', top: '360px', width: '140px', height: '140px', borderRadius: '70px', background: RED, color: '#fff', fontSize: '90px', fontWeight: 900, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 6 }, '?');
const kit2 = E(S2, { left: '140px', top: '860px', width: '800px', height: '440px', zIndex: 4 }, `<div style="position:absolute;left:40px;top:36px;font-size:40px;font-weight:800">👨‍🍳 Kitchen</div>

  <div style="position:absolute;left:390px;top:320px;width:370px;text-align:center;font-size:28px;font-weight:700;color:${MUT}">Order pahunchne mein</div>`, 'card');

const s3a = T(S3, 'c', 260, 84, '<span class="red">Result?</span>');
const cu3 = E(S3, { left: '90px', top: '470px', width: '430px', height: '760px', zIndex: 4 }, `<div style="position:absolute;left:0;width:430px;top:60px;text-align:center;font-size:180px">😠</div><div style="position:absolute;left:0;width:430px;top:290px;text-align:center;font-size:40px;font-weight:800">Customer</div><div style="position:absolute;left:0;width:430px;top:350px;text-align:center;font-size:40px;font-weight:900;color:${RED}">Unhappy</div>
