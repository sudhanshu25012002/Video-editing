// Parent reel: tender piano + strings, opening into a hopeful groove, with split-flap / home / institute sound design.

  section(BUILT, OUTRO, MAJ, { pv: 1, str: 0.004, bass: true, mel: true, drums: true });   // the system: bright, hopeful groove
  section(OUTRO, CTA, [[41, [57, 60, 64]], [48, [55, 60, 64]], [41, [57, 60, 64]], [43, [55, 59, 62]]], { pv: 1, str: 0.006, bass: true, mel: true });   // "Education sirf…": emotional swell

    whoosh: (t, p) => { const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; s.loop = true; fl.type = 'bandpass'; fl.Q.value = 1.4;

    keycard: (t, p) => { [0, 0.1].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 2600; g.gain.setValueAtTime(0.0001, t + d); g.gain.linearRampToValueAtTime(0.03, t + d + 0.004); g.gain.setValueAtTime(0.03, t + d + 0.06); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.07); o.connect(g).connect(pan(fx, p)); o.start(t + d); o.stop(t + d + 0.08); });

    coin: (t, p) => { SFXF.bell(t, p, [88, 95]); nz(t, 0.25, 7000, 'highpass', 0.03, fx, 1, p); },
    key: (t, p) => { nz(t, 0.018, 2600, 'bandpass', 0.1, fx, 2, p); },
    paper: (t, p) => { for (let k = 0; k < 5; k++) nz(t + k * 0.05, 0.06, 2500 + rnd() * 2500, 'bandpass', 0.05, fx, 1, p); },
    rise: (t, p) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(hz(64), t); o.frequency.exponentialRampToValueAtTime(hz(76), t + 1.0);

  };
  // ---- payment-specific effects

    lg.gain.value = 60; lfo.connect(lg).connect(o.frequency); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(k ? 0.006 : 0.014, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

  SFXF.notif = (t, p) => [81, 88].forEach((m, k) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = hz(m); env(g, t + k * 0.09, 0.003, 0.06, 0.25); o.connect(g).connect(pan(fx, p)); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.3); });

  // split-flap clatter for the blinds transition
  SFXF.flap = (t, p) => { for (let k = 0; k < 8; k++) { nz(t + k * 0.022, 0.012, 2600 + k * 120, 'bandpass', 0.05, fx, 4, -0.7 + k * 0.2); } };
  SFXF.tap = (t, p) => { nz(t, 0.012, 2400, 'bandpass', 0.09, fx, 3, p); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(600, t + 0.04); env(g, t, 0.002, 0.04, 0.05); o.connect(g).connect(pan(fx, p)); o.start(t); o.stop(t + 0.08); };
  SFXF.flip = (t, p) => nz(t, 0.05, 3000, 'bandpass', 0.06, fx, 1.2, p);
  SFXF.hmm = (t, p) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(hz(67), t); o.frequency.linearRampToValueAtTime(hz(70), t + 0.18); env(g, t, 0.01, 0.05, 0.2); o.connect(g).connect(pan(fx, p)); o.start(t); o.stop(t + 0.25); };

  const buf = await ctx.startRendering();

  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};
