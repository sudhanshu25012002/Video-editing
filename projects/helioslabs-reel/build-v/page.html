<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HeliosLabs Reel</title>
<style>
  :root {
    --bg: #F3ECDF;
    --ink: #1C1726;
    --muted: #8A8172;
    --line: #E2D8C6;
    --card: #FFFCF6;
    --tile: #E9DDCA;
    --accent: #5A17E6;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  body { width: 1920px; height: 1080px; font-family: 'Inter', sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .abs { position: absolute; }
  .mask { position: absolute; overflow: hidden; }
  .mask > span { display: inline-block; white-space: nowrap; }
  .bar { position: absolute; background: var(--accent); }
  .txt { white-space: nowrap; font-weight: 700; letter-spacing: -0.03em; }
  .acc { color: var(--accent); }
  .phone { background: var(--card); border-radius: 44px; box-shadow: 0 0 0 2px var(--line); }
  .tile { position: absolute; background: var(--tile); border-radius: 6px; }
  .btn { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 600; border-radius: 10px; }
  .bubble { position: absolute; padding: 14px 20px; border-radius: 22px; font-size: 20px; font-weight: 500; white-space: nowrap; }
  .card { position: absolute; background: var(--card); border-radius: 20px; box-shadow: 0 0 0 2px var(--line); }
  #logoTL { position: absolute; left: 44px; top: 36px; width: 72px; height: 72px; border-radius: 16px; }
  #caption { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 28px; font-weight: 500; color: var(--ink); }
  body.v { width: 1080px; height: 1920px; }
  body.v #caption { bottom: 250px; font-size: 34px; padding: 0 60px; line-height: 1.35; }
  body.v #caption span { white-space: normal; }
  #caption span { display: inline-block; background: rgba(255,252,246,0.92); padding: 10px 22px; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--line); }
</style>

    [26.5, [steps[0], stepsEmpty[1], stepsEmpty[2]]],
    [27.0, [steps[0], steps[1], stepsEmpty[2]]],
    [27.5, steps],
    [30.0, tall],                                 // big beat: tall columns

}
buildBarKeys();
function barState(t, k) {
  const d = k * 0.05;
  let i = 0;
  while (i + 1 < BK.length && BK[i + 1][0] + d <= t) i++;
  if (i === 0) return BK[0][1][k];
  const a = BK[i - 1][1][k], b = BK[i][1][k];
  const p = sp(t, BK[i][0] + d);
  return { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: Math.max(0, lerp(a.w, b.w, p)), h: Math.max(0, lerp(a.h, b.h, p)), sk: lerp(a.sk, b.sk, p) };
}

// ---------- cursor keys: [t, x, y] ----------
const CK = [
  [0, 1500, 1200], [3.0, 1500, 1200], [3.4, 980, 540], [5.0, 1060, 280], [6.8, 1300, 1200],
  [15.5, 1700, 1100], [16.2, 1250, 700], [17.2, 800, 860], [19.0, 1500, 1200],
  [23.8, 1300, 1200], [24.4, 980, 776], [26.0, 1400, 860], [28.0, 1500, 776], [29.5, 1700, 1200],

  [15.5, 1300, 1900], [16.2, 1250, 1000], [17.2, 1160, 836], [19.0, 1300, 2100],
  [23.8, 1300, 2000], [24.4, 980, 1292], [26.0, 1300, 1700], [28.0, 980, 1832], [29.5, 1300, 2200]);
function cursorAt(t) {
  let i = 0;
  while (i + 1 < CK.length && CK[i + 1][0] <= t) i++;
  if (i === 0) return { x: CK[0][1], y: CK[0][2] };
  const a = CK[i - 1], b = CK[i];
  const p = expo(t, b[0], 0.55);
  return { x: lerp(a[1], b[1], p), y: lerp(a[2], b[2], p) };
}

// ---------- camera keys: [t, cx, cy, zoom] (eased continuously between keys) ----------
const CAM = [
  [0, 960, 540, 1.0], [2.0, 960, 540, 1.04],
  [3.6, 968, 560, 1.12], [5.4, 1040, 400, 1.22], [6.4, 960, 430, 1.14], [8.4, 960, 470, 1.18],
  [9.6, 760, 540, 1.04], [12.6, 760, 540, 1.06], [13.2, 960, 540, 1.0],
  [15.2, 960, 560, 1.02], [17.3, 800, 760, 1.38], [18.8, 760, 420, 1.28], [21.6, 860, 470, 1.32],
  [22.4, 960, 540, 1.0], [24.6, 960, 700, 1.3], [26.3, 1500, 600, 1.38], [29.6, 1500, 620, 1.44],
  [30.2, 960, 500, 1.12], [35.8, 960, 500, 1.16],
  [36.6, 960, 540, 1.14], [44.0, 960, 540, 1.22],
];
if (V) CAM.splice(0, CAM.length,
  [0, 960, 500, 1.0], [2.0, 960, 500, 1.04],
  [3.6, 968, 560, 1.55], [5.4, 1040, 420, 1.8], [6.4, 960, 500, 1.6], [8.4, 960, 520, 1.62],
  [9.6, 960, 760, 1.0], [12.6, 960, 760, 1.04], [13.2, 960, 770, 1.15],
  [15.2, 960, 770, 1.18], [17.3, 1160, 830, 1.7], [18.8, 960, 520, 1.16], [21.6, 960, 540, 1.2],
  [22.4, 960, 1070, 1.0], [24.6, 960, 1080, 1.3], [26.3, 960, 1620, 1.3], [29.6, 960, 1640, 1.36],
  [30.2, 960, 600, 1.4], [35.8, 960, 600, 1.45],
  [36.6, 960, 760, 1.3], [44.0, 960, 760, 1.38]);
function camAt(t) {
  let i = 0;
  while (i + 1 < CAM.length && CAM[i + 1][0] <= t) i++;
  if (i + 1 >= CAM.length) return { cx: CAM[i][1], cy: CAM[i][2], z: CAM[i][3] };
  const a = CAM[i], b = CAM[i + 1], span = b[0] - a[0];
  const M = Math.min(0.6, span);
  const ws = b[0] - M;                                   // move window start
  const drift = z => z * (1 + 0.03 * clamp((t - a[0]) / span)); // slow push, never still
  if (t < ws) return { cx: a[1], cy: a[2], z: drift(a[3]) };
  const p = inout(clamp((t - ws) / M));
  const za = a[3] * (1 + 0.03 * clamp((ws - a[0]) / span));
  return { cx: lerp(a[1], b[1], p), cy: lerp(a[2], b[2], p), z: lerp(za, b[3], p) };
}

  { const url = 'yourshop.in'; const n = Math.floor(clamp((t - 13.5) / 1.0) * url.length); addr.textContent = url.slice(0, n); urlLabel.textContent = url.slice(0, n); urlLabel.style.visibility = (t > 13.3 && t < 16.5) ? 'visible' : 'hidden'; }
  nav.style.clipPath = `inset(0 ${(1 - clamp(sp(t, 14.0))) * 100}% 0 0)`;

  { const p = clamp(sp(t, 18.0)); cartBadge.style.transform = `scale(${p})`; cartBadge.style.visibility = (t < 18.0 || t > 22.0) ? 'hidden' : 'visible'; }

  // ----- scene 4: features -----

  waBtn.style.transform = `scale(${press(25.0)})`;
  { const p = sp(t, 25.5); waMsg.style.transformOrigin = 'right top'; waMsg.style.transform = `scale(${0.6 + 0.4 * p})`; waMsg.style.clipPath = `inset(0 0 0 ${(1 - clamp(p)) * 100}%)`; waMsg.style.visibility = t < 25.5 ? 'hidden' : 'visible'; }
  waTick.style.clipPath = `inset(0 0 0 ${(1 - clamp(sp(t, 26.0))) * 100}%)`;
  payBtn.style.transform = `scale(${press(28.5)})`;
  payOk.style.clipPath = `inset(0 ${(1 - clamp(sp(t, 29.0))) * 100}% 0 0)`;

  // ----- scene 5: price -----

  showText(rupee, t, 30.0, 35.8);
  digits.forEach((d, k) => showText(d, t, 30.5 + k * 0.08, 35.9 + k * 0.05));
  showText(perMonth, t, 31.0, 35.7);
  showText(incl1, t, 32.0, 35.7);

  { const p = clamp(sp(t, 36.5));

  showText(name, t, 37.0);

    Object.assign(b.style, { left: (s.x - s.w / 2) + 'px', top: (s.y - s.h / 2) + 'px', width: s.w + 'px', height: s.h + 'px', transform: `skewX(${s.sk}deg)` });
    b.style.visibility = (s.w < 0.5 || s.h < 0.5) ? 'hidden' : 'visible';
  });
